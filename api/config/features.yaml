    - api/services/editorial_package_research_service.py
    - api/domains/intelligence_hub/routes/editorial_packages.py
    - api/config/prompts/research/package_knowledge_profile.md
  notes: >
    Entity-keyed research product (is/is-not + cited report) for medicine,
    neurodiversity, and artificial-intelligence. Seeded via
    ensure_package_from_entity (legacy_seed entity:{domain}:{id}); auto-merged
    after editorial_research_pass. Requires migration 294.

editorial_reduction:
  lifecycle: staged
  enabled: true
  introduced_in: "11.0.0"
  phase_name: editorial_reduction_pass
  modules:
    - api/services/editorial_package_reduction_service.py
    - api/config/prompts/reduction/package_reduction.md
    - api/domains/intelligence_hub/routes/editorial_packages.py
  flags:
    env: EDITORIAL_REDUCTION_ENABLED
  notes: >
    Reduction modality LLM pass: uncouple unrelated / weak / geo+entity-mismatched
    members and links from the editorial package only (status=removed|quarantined).
    Never deletes articles, events, entities, or claims. Auto-applies
    (EDITORIAL_REDUCTION_AUTO_APPLY, default true). Cycle escape: when both
    Narrative and Reduction report zero changes (or max rounds), clear → Editor.
    Otherwise routes back to research|narrative. Requires migration 288+.

editorial_narrative:
  lifecycle: staged
  enabled: true
  introduced_in: "11.0.0"
  phase_name: editorial_narrative_pass
  modules:
    - api/services/editorial_package_narrative_service.py
    - api/config/prompts/narrative/package_narrative.md
    - api/domains/intelligence_hub/routes/editorial_packages.py
  flags:
    env: EDITORIAL_NARRATIVE_ENABLED
  notes: >
    Narrative modality LLM assembly: attach events/entities/articles, assign
    anchors, create defensible links, update summary_stub. Package membership
    only. Changes → Reduction; both-zero or max rounds → Editor. Requires
    migration 289.

editorial_research:
  lifecycle: staged
  enabled: true
  introduced_in: "11.0.0"
  phase_name: editorial_research_pass
  modules:
    - api/services/editorial_package_research_service.py
    - api/config/prompts/research/package_research.md
    - api/domains/intelligence_hub/routes/editorial_packages.py
  flags:
    env: EDITORIAL_RESEARCH_ENABLED
  notes: >
    Research modality: package-scoped claim extract → facts promote → optional
    literature appraisal, then LLM attach/link of claims/facts/papers/hypotheses.
    Changes → Reduction; Research zero + last Reduction zero → Editor; max rounds
    → Editor. Domains stay Research allowlist. Requires migration 290.

editorial_compose:
  lifecycle: staged
  enabled: true
  introduced_in: "11.0.0"
  modules:
    - api/services/editorial_package_compose_service.py
    - api/config/prompts/editor/package_compose.md
    - api/services/news_story_service.py
    - api/domains/intelligence_hub/routes/editorial_packages.py
  flags:
    env: EDITORIAL_COMPOSE_ENABLED
  notes: >
    Editor compose: when a package reaches ready_for_editor (or draft is a thin
    stub/source-list scaffold), generate a source-grounded news_stories draft with
    inline [@m] citations from member excerpts. Publish runs mode=publish assembly
    over linked sources into a detailed final report, then citation-gates.
    Invoked from ensure_editor_scaffold, POST .../compose/run, and
    POST .../stories/{id}/publish. Prefers package_evidence_briefs.brief_md when present.

editorial_evidence_expand:
  lifecycle: staged
  enabled: true
  introduced_in: "11.0.0"
  phase_name: editorial_evidence_expand_pass
  modules:
    - api/services/editorial_package_evidence_expand_service.py
    - api/services/package_evidence_brief_service.py
    - api/config/prompts/narrative/package_evidence_expand.md
    - api/domains/intelligence_hub/routes/editorial_packages.py
  flags:
    env: EDITORIAL_EVIDENCE_EXPAND_ENABLED
  notes: >
    Narrative evidence-expand: gap-driven retrieve (DB + embeddings + Wiki/spine +
    optional NewsAPI/web URL pull) → attach theme-gated members → synthesize
    package_evidence_briefs (cited educational profile) → vault note → Reduction.
    Research stays literature-focused; Research parity writes the same brief table.
    Requires migration 296.

