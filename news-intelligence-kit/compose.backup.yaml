# Enable: docker compose -f compose.yaml -f compose.backup.yaml --profile backup up -d
services:
  backup-cron:
    image: docker:27-cli
    restart: unless-stopped
    profiles: [backup]
    working_dir: /kit
    volumes:
      - .:/kit
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sh /kit/scripts/backup_kit.sh || true
          sleep $((BACKUP_INTERVAL_HOURS * 3600))
        done
