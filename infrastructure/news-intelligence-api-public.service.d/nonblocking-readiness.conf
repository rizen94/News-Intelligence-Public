# Do not keep the unit in "activating (start-post)" for minutes.
# Type=simple: uvicorn is already serving; readiness is best-effort and non-fatal.
# Pair with scripts/systemd_wait_readiness.sh (short NI_READINESS_* defaults).
[Service]
ExecStartPost=
ExecStartPost=-/opt/news-intelligence/scripts/systemd_wait_readiness.sh
TimeoutStartSec=120
Environment=NI_READINESS_ATTEMPTS=24
Environment=NI_READINESS_SLEEP_SEC=2
