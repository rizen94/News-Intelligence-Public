# /etc/systemd/system.conf.d/99-widow-runtime-watchdog.conf
# SP5100 TCO hardware watchdog (/dev/watchdog) — reboot if the kernel stops petting.
# Mitigates overnight hard hangs (e.g. 2026-09-26 ~00:34 GPU-driver death → host silent
# until morning manual power). Without this, a wedged kernel skips 00:45 graceful reboot.
#
# Install (Widow):
#   sudo mkdir -p /etc/systemd/system.conf.d
#   sudo cp infrastructure/systemd/99-widow-runtime-watchdog.conf /etc/systemd/system.conf.d/
#   sudo systemctl daemon-reexec
# Verify: systemctl show -p RuntimeWatchdogSec -p WatchdogDevice

[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=10min
WatchdogDevice=/dev/watchdog
